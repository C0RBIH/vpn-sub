name: Update VPN subscription with profile name

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original configs
        run: |
          curl -L -o original.txt "https://raw.githubusercontent.com/Kirillo4ka/eavevpn-configs/main/Vless-Reality-White-Lists-Rus-Mobile.txt"

      - name: Add profile name at the top
        run: |
          # Создаём новый файл: сначала строка с названием профиля, потом оригинальное содержимое
          echo "# 🪖MSC VPN🗽" > subscription.txt
          echo "" >> subscription.txt
          cat original.txt >> subscription.txt

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Auto-update with profile name"
