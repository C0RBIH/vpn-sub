name: Update subscription - remove EaveVPN

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original configs
        run: |
          curl -L -o original.txt "https://raw.githubusercontent.com/Kirillo4ka/eavevpn-configs/main/Vless-Reality-White-Lists-Rus-Mobile.txt"

      - name: Remove 'EaveVPN' from server names and add profile title
        run: |
          # Удаляем слово EaveVPN (с пробелами и без) из каждой строки
          # Также удаляем возможные лишние пробелы после удаления
          sed -E 's/EaveVPN\s*//g' original.txt | sed -E 's/\s+/ /g' > cleaned.txt
          
          # Добавляем в начало файла строку с названием профиля (если Happ поддерживает)
          echo "# 🪖MSC VPN🗽" > subscription.txt
          echo "" >> subscription.txt
          cat cleaned.txt >> subscription.txt

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Auto-update: removed EaveVPN, added profile name"
