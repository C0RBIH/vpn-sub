name: Update subscription - clean old headers & remove EaveVPN

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original configs
        run: |
          curl -L -o original.txt "https://raw.githubusercontent.com/Kirillo4ka/eavevpn-configs/main/Vless-Reality-White-Lists-Rus-Mobile.txt"

      - name: Remove old headers and EaveVPN
        run: |
          # Удаляем все строки, начинающиеся с '#' (комментарии и заголовки)
          # Оставляем только строки, которые начинаются с vless://
          grep '^vless://' original.txt > filtered.txt
          
          # Удаляем слово EaveVPN из оставшихся строк
          sed -E 's/EaveVPN\s*//g' filtered.txt | sed -E 's/\s+/ /g' > cleaned.txt
          
          # Создаём новый файл с правильными заголовками
          echo "# 🪖MSC VPN🗽" > subscription.txt
          echo "# profile-title: 🪖MSC VPN🗽" >> subscription.txt
          echo "# profile-update-interval: 2" >> subscription.txt
          echo "# Дата и время обновления: $(date '+%Y-%m-%d %H:%M:%S')" >> subscription.txt
          echo "" >> subscription.txt
          cat cleaned.txt >> subscription.txt

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Clean old headers, set profile title, remove EaveVPN"
